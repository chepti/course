r\">\r\n                      <a href=\"https://chatgpt.com/g/g-68d96baff3488191a0ced496f44dd992-mkhvll-symvltvrym\" target=\"_blank\" class=\"styled-button\" data-track-click>למחולל הסימולטורים<\/a>\r\n                    <\/div>"}, {"id": "help_tools_special_prompts-3", "title": "פרומפט מערכת - מכוונים את הבינה מראש", "kind": "video", "mode": "video", "videos": ["xVjS6AHIuGM"], "comments": false, "html": "<p>אפשר להגדיר לבינה הנחיות קבועות שילוו כל שיחה - כך היא עונה בדיוק בסגנון ובגישה שמתאימים לנו.<\/p>\r\n                    <div class=\"cu4-video\" data-yt=\"xVjS6AHIuGM\"><div class=\"cu4-video-title\">התאמה קטנה של פרומפט מערכת בקלוד<\/div><button type=\"button\" class=\"cu4-video-play\" aria-label=\"הפעלת הסרטון\"><img src=\"https://i.ytimg.com/vi/xVjS6AHIuGM/hqdefault.jpg\" alt=\"\" loading=\"lazy\"><span class=\"cu4-video-btn\"><svg viewBox=\"0 0 24 24\"><polygon points=\"6 3 20 12 6 21 6 3\"/><\/svg><\/span><\/button><\/div>", "raw": "<p>אפשר להגדיר לבינה הנחיות קבועות שילוו כל שיחה - כך היא עונה בדיוק בסגנון ובגישה שמתאימים לנו.<\/p>\r\n                    <p>[video: https://www.youtube.com/embed/xVjS6AHIuGM | התאמה קטנה של פרומפט מערכת בקלוד]<\/p>"}]}]}, {"id": "discussion", "title": "דיון", "intro": "", "rawIntro": "", "groups": [{"id": "discussion", "title": "דיון", "rule": "all", "need": 1, "intro": "", "rawIntro": "", "items": [{"id": "discussion-1", "title": "דיון", "kind": "discussion", "mode": "comment", "videos": [], "comments": true, "html": "<p>השאלות האתיות סביב הבינה המלאכותית מזמנות בחינה עמוקה של גבולות הטכנולוגיה, יחסי אנוש-מכונה, וההשפעות הפסיכולוגיות והחינוכיות של ייעוץ דיגיטלי בגילאים שונים.<\/p>\r\n                    <ul>\r\n                      <li>מה השאלות האתיות הכי משמעותיות לדעתכם שעולות ממצב שבו כולנו מתייעצים עם בינה מלאכותית?<\/li>\r\n                      <li>אילו התאמות נכון לדעתכם להפעיל לפי גיל - ביסודי, על יסודי, ובקרב מורים?<\/li>\r\n                      <li>האם התנסות עם אחד הכלים הלחיצה אתכם?<\/li>\r\n ומר פתוח\" רק את <b>התוצר הסופי<\/b> (כמו כל חומר הוראה אחר), כשהתיאור הקצר בתחילתו מסביר שהוא נולד מתוך תהליך התייעצות.<\/li>\r\n<\/ol>\r\n<div class=\"button-wrapper\"><a class=\"styled-button\" href=\"https://openstuff.co.il/\" target=\"_blank\" rel=\"noopener\" data-track-click=\"\">חומר פתוח<\/a><\/div>\r\n<div><div class=\"task-done-box\" style=\"margin:20px 0;padding:15px;background:#f0f7ff;border-right:4px solid var(--primary-color);border-radius:4px;\"><label style=\"display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:bold;\"><input type=\"checkbox\" data-track-manual style=\"width:20px;height:20px;cursor:pointer;\"><span>העליתי לחומר פתוח<\/span><\/label><\/div><\/div>\n<p><a class=\"styled-button\" href=\"https://openstuff.co.il/upload/\" target=\"_blank\" rel=\"noopener\" data-track-click=\"\">איך מעלים לחומר פתוח? מדריך, סרטון ושאלות נפוצות<\/a><\/p>\r\n<p><img class=\"illustration\" style=\"max-width: 100%;border-radius: 8px;margin-top: 20px\" src=\"https://i.imgur.com/I1zrnZc.png\" alt=\"איור משימה\" /> <\/p>", "raw": "<p><b>מטרה:<\/b> להשתמש בבינה המלאכותית ככלי להתייעצות מקצועית שמולידה חומר הוראה חדש ומשמעותי למורים אחרים.<\/p>\r\n<p><b>מה עושים?<\/b><\/p>\r\n<ol>\r\n<li><b>בחרו נושא חינוכי<\/b> או דילמה פדגוגית שמעסיקה אתכם השנה, מורכבות שקיימת באחת הכיתות שלכם.<\/li>\r\n<li><b>נתחו אותה בשיחה עם הבינה<\/b> (בכתב או בעל פה) – בקשו מהבינה לשאול אתכם שאלות שיעזרו לחדד את המטרה, הקהל, ואת צורת ההוראה האפשרית.<\/li>\r\n<li><b>מתוך השיחה – פתחו תוצר הוראה:<\/b> משימה לתלמידים, דף עבודה, הפעלה, יחידת הוראה קצרה, או כלי לחשיבה כיתתית. נסו לשלב את זה דווקא תוך כדי למידה של הנושאים הרגילים שלכם (\"איך אפשר ללמד על סוגי תאים ויחד עם זה לעבוד על פירגון הדדי בכיתה\").<\/li>\r\n<li>העלו למאגר \"חומר פתוח\" רק את <b>התוצר הסופי<\/b> (כמו כל חומר הוראה אחר), כשהתיאור הקצר בתחילתו מסביר שהוא נולד מתוך תהליך התייעצות.<\/li>\r\n<\/ol>\r\n<div class=\"button-wrapper\"><a class=\"styled-button\" href=\"https://openstuff.co.il/\" target=\"_blank\" rel= מו התנסויות, עבודה בקבוצות, או חיבור אישי) כדי שהתוצאה לא תהיה \"יבשה\".<\/li>\r\n<li><strong>טקסטים ושאלות:<\/strong> נראה איך לייצר טקסטים בסגנונות שונים (מדעי, חווייתי) ולבקש שאלות מגוונות – כולל שאלות חשיבה מסדר גבוה.<\/li>\r\n<li><strong>דפי עבודה, כרטיסיות עבודה, הנחיות לתחנות:<\/strong> ניצור דפים מעניינים, מאויירים - ומוכנים להדפסה.<\/li>\r\n<li><strong>הערכה:<\/strong> משימות הערכה חלופית, מחוונים ועבודה סביב מבחנים - ביחידה 8, יחידה שלמה בנושא.<\/li>\r\n<\/ol>\r\n<p>בסוף היחידה, תוכלו להתאים ולייצר חומרים בקלות, תוך מינוף הכלים שיש ל-AI להציע.<\/p>\n<div class=\"cu4-video\" data-yt=\"Bhw1OPsekKw\"><button type=\"button\" class=\"cu4-video-play\" aria-label=\"הפעלת הסרטון\"><img src=\"https://i.ytimg.com/vi/Bhw1OPsekKw/hqdefault.jpg\" alt=\"\" loading=\"lazy\"><span class=\"cu4-video-btn\"><svg viewBox=\"0 0 24 24\"><polygon points=\"6 3 20 12 6 21 6 3\"/><\/svg><\/span><\/button><\/div>", "raw": "<p><strong>ברוכים הבאים למפגש העוסק בשילוב טכנולוגיות בינה מלאכותית ביצירת חומרי למידה. במפגש זה נלמד כיצד ניתן להיעזר בכלי AI כדי לייעל ולשפר את תהליך יצירת חומרי הלימוד, תוך שמירה על האיכות הפדגוגית והמגע האישי שלנו כמורים.<\/strong><\/p>\r\n<p>ברוכים הבאים ליחידה!<\/p>\r\n<p>אנחנו הולכים ללמוד כאן איך להשתמש בבינה מלאכותית (AI) כדי להקל עלינו בעבודה היומיומית.<\/p>\r\n<p>הפוקוס הוא על חומרי למידה מהסוג הרגיל והמסורתי – דברים שאתם כבר עושים ממילא בכיתה, בלי מכשירים אינטראקטיביים מיוחדים.<\/p>\r\n<p>למה זה טוב? המטרה היא כפולה: להפוך את ההוראה ליותר איכותית, למידה יותר מעורבת, וגם לחסוך לכם זמן. במקום להכין שיעור אחד, תוכלו להכין ארבעה או חמישה שיעורים ברמות שונות, מה שמאפשר לכם ליישם דיפרנציאליות בקלות ולהגשים חלומות פדגוגיים שתמיד רציתם, אבל דרשו המון השקעה. הבינה המלאכותית מתפקדת פה כעוזר הוראה מדהים ומדריך פדגוגי נהדר שיש לו המון ידע וניסיון.<\/p>\r\n<p>מה נלמד לעשות בפועל?<\/p>\r\n<ol>\r\n<li><strong>מערכי שיעור:<\/strong> נלמד איך לבקש מערך שיעור, נזכור תמיד לדרוש ערך מוסף (כמו התנסויות, עבודה בקבוצות, או חיבור אישי) כדי שהתוצאה לא תהיה \"יבשה\".<\/li>\r\n< תף:<\/p>\r\n<p><div class=\"prompt-container\"><button class=\"copy-button\"><\/button><pre>Act as an Expert Infographic Personal Brand Designer. Your goal is to create a professional 3D infographic poster about me, based on my personal history and memory stored in our conversation history.\n\nSTRICT PROTOCOL:\n\n1. PHASE 1 (Memory Scan): Review all the information you have about me (hobbies, profession, core values, mission, strengths, and daily routine).\n\n2. PHASE 2 (The Gatekeeper): You ARE NOT ALLOWED to generate any image yet. You must first stop and ask me to upload a clear portrait photo of myself.\n\n3. PHASE 3 (Execution): Only after I upload the photo, use your image generation tool to generate the poster based on the visual guidelines below.\n\nVISUAL GUIDELINES &amp; STYLE:\n\nAspect Ratio: Exactly 9:16 (Vertical Poster).\n\nArt Style: Sophisticated, high-fidelity 3D stylized aesthetic (Mature Pixar-quality). It must look professional and refined, NOT childish or like a toy.\n\nColor Palette: Restrained, harmonious, and natural earth-tones (Olive greens, muted blues, charcoal, sand, and terracotta). Avoid loud, oversaturated colors or flashy gold/diamonds.\n\nRealism &amp; Depth:\n\nEvery information panel must be an &quot;irregular, textured physical paper note&quot; with rough, torn, or deckled edges.\n\nApply deep Ambient Occlusion shadows behind every note and object to create a strong physical 3D depth (making them appear raised from the background).\n\nNotes must be &quot;physically attached&quot; using detailed 3D props: metallic binder clips, push-pins, paperclips, or safety pins.\n\nCOMPOSITION STRUCTURE (RTL Hebrew Text):\n\nCentral Character: A full-body 3D likeness based on my uploaded photo, dressed in attire that reflects my personality/profession.\n\nInset Photo: A clean circular frame in the corner showing the original photo, with a 3D arrow pointing to the character.\n\nFloating Notes (Hebrew Titles, Right-to-Left):\n\n&quot;השליחות שלי&quot;: My core mission/purpose.\n\n&quot;בליבה שלי&quot;: My top 5 personality traits with 3D props.\n\n&quot;דברים שאני אוהב&quot;: My hobbies/interests with detailed 3D icons.\n\n&quot;החוזקות שלי&quot;: My professional/personal strengths with unique 3D icons (Brain, Star, etc.).\n\n&quot;הוייב היומי&quot;: 3 physical Polaroid-style snapshots showing my daily routine with captions.\n\nBackground: A serene, natural landscape that complements the color palette.\n\nForeground: Scattered 3D props related to my life (e.g., tools, books, gadgets) with realistic shadows.\n\nMANDATORY WATERMARK: Include the Hebrew text &quot;תוכן שהופק על ידי בינה מלאכותית&quot; clearly at the bottom center.\n\nConfirm you have scanned my memory and ask me for my photo to begin.<\/pre><\/div><\/p>\r\n<hr /><\/div>", "raw": "<p>גם צ'אטGPT מצליח לשלב היטב טקסט בתמונות. ניתן ליצור בו כרזות מפורטות ועשירות, אינפוגרפיקות ופליירים. למשל, אני תמיד מעדיפה ליצור בו את תמונות הרקע למרחבי 360 מעלות (הרחבה ביחידה 5), וגם יש בו מציג 360 מובנה. השילוב של העברית כמעט לגמרי תקין.<\/p>\r\n<p><a href=\"https://tikshuv.chepti.com/wp-content/uploads/2026/06/כרזה.png\"><img class=\"alignnone wp-image-33233\" src=\"https://tikshuv.chepti.com/wp-content/uploads/2026/06/כרזה.png\" alt=\"\" width=\"613\" height=\"921\" /><\/a><\/p>\r\n<div>\r\n<p>פרומפט - העלו לGPT תמונה שלכם והדביקו את הפרומפט. הוא שואב מהזיכרון שלו לגביכם, ולכן עדיף לא להפעיל אותו בחשבון משותף:<\/p>\r\n<p>[prompt]<\/p>\r\n<p>Act as an Expert Infographic Personal Brand Designer. Your goal is to create a professional 3D infographic poster about me, based on my personal history and memory stored in our conversation history.<\/p>\r\n<p>STRICT PROTOCOL:<\/p>\r\n<p>1. PHASE 1 (Memory Scan): Review all the information you have about me (hobbies, profession, core values, mission, strengths, and daily routine).<\/p>\r\n<p>2. PHASE 2 (The Gatekeeper): You ARE NOT ALLOWED to generate any image yet. You must first stop and ask me to upload a clear portra פני הסבר מסורתי?<\/p>\r\n                    <p><strong>חלופה 2: תלמידים כיוצרים<\/strong><\/p>\r\n                    <p>אם הייתם נותנים לתלמידים שלכם משימה ליצור תוכן מדיה על נושא שלמדו - איזה סוג תוכן הייתם בוחרים? באיזו שכבת גיל? מה הלמידה העמוקה שתתרחש בתהליך היצירה עצמו (מעבר לידע על הנושא)?<\/p>\r\n                    \r\n                    <img src=\"https://i.imgur.com/wI5ovIv.jpg\" alt=\"איור דיון\" class=\"illustration\">"}]}]}, {"id": "task", "title": "משימה", "intro": "", "rawIntro": "", "groups": [{"id": "task", "title": "משימה", "rule": "all", "need": 1, "intro": "", "rawIntro": "", "items": [{"id": "task-1", "title": "משימה", "kind": "task", "mode": "check", "videos": [], "comments": false, "html": "<p>צרו תוכן מדיה אחד שישרת מורים אחרים:<\/p>\r\n<h4>אפשרות 1: סרטון הסבר (2-4 דקות)<\/h4>\r\n<p>הסבר קצר על נושא לימודי ספציפי - מושג מתמטי, תהליך מדעי, אירוע היסטורי. בחרו נושא שמורים רבים מלמדים והכינו סרטון ברור ומסודר.<\/p>\r\n<h4>אפשרות 2: דמות מדברת<\/h4>\r\n<p>תמונה מונפשת של דמות רלוונטית (היסטורית/ספרותית/מדעית) שמספרת על עצמה או מסבירה מושג. הקפידו על דיוק תוכני ואותנטיות.<\/p>\r\n<h4>אפשרות 3: פודקאסט חינוכי<\/h4>\r\n<p>שיחה או הסבר מוקלט (3-5 דקות) על נושא מעניין. יכול להיות סקירה, ראיון מדומה, או הצגת נושא במבט חדש. (אם בחרתם פודקאסט אוטומטי - ציינו בפוסט כיצד התאמתם ובדקתם את איכות התוצר)<\/p>\r\n<h4>אפשרות 4: סרטון עלילתי קצר<\/h4>\r\n<p>סיפור או סצנה שממחישה רעיון לימודי - משל, אגדה, רגע היסטורי. הקפידו על איכות ויזואלית ועל קשר ברור לתוכן הלימודי.<\/p>\r\n<hr />\r\n<h4>מה להגיש:<\/h4>\r\n<ul>\r\n<li>קישור לתוצר הסופי (סרטון/אודיו) - לוודא שנגיש לצפיה.<\/li>\r\n<li>בפוסט פרטו:\r\n<ul>\r\n<li>איזה סוג תוכן בחרתם ולמה<\/li>\r\n<li>לאיזה נושא לימודי ושכבת גיל זה מתאים (בחרו קטגוריות ותגיות)<\/li>\r\n<li>באיזה כלי השתמשתם (\"פלטפורמה\")<\/li>\r\n<li>מה היה מאתגר ומה הפתיע אתכם<\/li>\r\n<li>הצעות שימוש פדגוגי - איך מורים יכולים לשלב את זה בשיעור<\/li>\r\n<\/ul>\r\n<\/li>\r\n<li>העלאה למאגר חומר פתוח - שתפו את התוצר שלכם כדי שמורים אחרים יוכלו להשתמש בו.<\/li>\r\n<\/ul>\r\n<p><strong>טיפ:<\/strong> בחרו נושא שאתם מלמדים או שאתם מכירים היטב - איכות התוכן חשובה לא פחות מהטכנולוגיה.<\/p>\r\n<div class=\"button-wrapper\"><a class=\"styled-button\" href=\"https://openstuff.co.il/\" target=\"_blank\" rel=\"noopener\" data-track-click=\"\">חומר פתוח<\/a><\/div>\r\n<div class=\"button-wrapper\"><a class=\"styled-button\" href=\"https://openstuff.co.il/upload/\" target=\"_blank\" rel=\"noopener\" data-track-click=\"\">איך מעלים לחומר פתוח? מדריך, סרטון ושאלות נפוצות<\/a><label style=\"display: flex;align-items: center;gap: 10px;cursor: pointer;font-weight: bold\"><\/label><\/div>\r\n<div class=\"task-done-box\" style=\"margin:20px 0;padding:15px;background:#f0f7ff;border-right:4px solid var(--primary-color);border-radius:4px;\"><label style=\"display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:bold;\"><input type=\"checkbox\" data-track-manual style=\"width:20px;height:20px;cursor:pointer;\"><span>העליתי לחומר פתוח<\/span><\/label><\/div>", "raw": "<p>צרו תוכן מדיה אחד שישרת מורים אחרים:<\/p>\r\n<h4>אפשרות 1: סרטון הסבר (2-4 דקות)<\/h4>\r\n<p>הסבר קצר על נושא לימודי ספציפי - מושג מתמטי, תהליך מדעי, אירוע היסטורי. בחרו נושא שמורים רבים מלמדים והכינו סרטון ברור ומסודר.<\/p>\r\n<h4>אפשרות 2: דמות מדברת<\/h4>\r\n<p>תמונה מונפשת של דמות רלוונטית (היסטורית/ספרותית/מדעית) שמספרת על עצמה או מסבירה מושג. הקפידו על דיוק תוכני ואותנטיות.<\/p>\r\n<h4>אפשרות 3: פודקאסט חינוכי<\/h4>\r\n<p>שיחה או הסבר מוקלט (3-5 דקות) על נושא מעניין. יכול להיות סקירה, ראיון מדומה, או הצגת נושא במבט חדש. (אם בחרתם פודקאסט אוטומטי - ציינו בפוסט כיצד התאמתם ובדקתם את איכות התוצר)<\/p>\r\n<h4>אפשרות 4: סרטון עלילתי קצר<\/h4>\r\n<p>סיפור או סצנה שממחישה רעיון לימודי - משל, אגדה, רגע היסטורי. הקפידו על איכות ויזואלית ועל קשר ברור לתוכן הלימודי.<\/p>\r\n<hr />\r\n<h4>מה להגיש:<\/h4>\r\n<ul>\r\n<li>קישור לתוצר הסופי (סרטון/אודיו) - לוודא שנגיש לצפיה.<\/li>\r\n<li>בפוסט פרטו:\r\n<ul>\r\n<li>איזה סוג תוכן בחרתם ולמה<\/li>\r\n<li>לאיזה נוש ם לקבל קוד מהבינה. ביחידה על אינטראקטיביות בלמידה כבר נגענו בקוד דרך קנבס וארטיפקטים במודלי השפה הגדולים. אבל כדי לבנות אפליקציה שכוללת גם מסד נתונים נוח, שמכילה פיצ'רים מגוונים ויש לה יכולת להציג מידע בצורה חכמה, לבצע מניפולציה על מסד הנתונים - נצטרך לעבוד עם כלים נוספים.<\/p>\r\n                    <p>לאבבל או בייס44 הם כלים שמאפשרים לבנות אפליקציות נחמדות עם בינה, אני לא ממליצה בגלל שהם \"גן סגור\" ובסוף מגבילים את יכולת היצירה בחינם.<\/p>\r\n                    <p>לעומתם, השפה שמצאתי שנותנת מענה להמון צרכים וגם מרחב פעילות וגמישות - היא אפפסקריפט. זו שפה מבית גוגל, שניתן לפתוח מתוך גליון Google Sheets. כך הגליון משמש כבסיס הנתונים, נוח לעריכה ידנית כשצריך מעבר לעבודה דרך הממשק של האפליקציה שנוצרה, שהיא בעצם מסוג HTML. אין הגבלה על כמות הפרויקטים, המשתמשים וכן הלאה.<\/p>\r\n                    \r\n                    <div class=\"cu4-video\" data-yt=\"xcmpU7E34AQ\"><div class=\"cu4-video-title\">מבט על - פיתוח אפליקציה (סרטון)<\/div><button type=\"button\" class=\"cu4-video-play\" aria-label=\"הפעלת הסרטון\"><img src=\"https://i.ytimg.com/vi/xcmpU7E34AQ/hqdefault.jpg\" alt=\"\" loading=\"lazy\"><span class=\"cu4-video-btn\"><svg viewBox=\"0 0 24 24\"><polygon points=\"6 3 20 12 6 21 6 3\"/><\/svg><\/span><\/button><\/div>\r\n\r\n                    <img src=\"https://i.imgur.com/jL6GOud.gif\" alt=\"גיף מחלום למוצר\" class=\"illustration\">\r\n\r\n                    <hr>\r\n                    <h4>מושגים:<\/h4>\r\n                    <p><strong>פרויקט אפפסקריפט<\/strong> - הקובץ בו נשמר הקוד. לכל פרויקט כתובת ייחודית.<\/p>\r\n                    <p><strong>IDE<\/strong> - כלי כתיבת קוד למתכנתים. כיום משלבים בינה בפנים, כך שהקוד נבנה ע\"י הבינה, אבל יש לאדם יכולת שליטה וכיוונון גבוהים יותר, וגם - אין צורך לכתוב מחדש קבצים שלמים. השינויים נערכים בקבצי הקוד רק איפה שנדרש. משמש לשפות קוד רבות.<\/p>\r\n                    <p><strong>גיטהאב<\/strong> - פלטפורמה לשמירת פרויקטי הקוד שלנו, ניהול היסטוריית גרסאות, ושיתוף קל עם קהילת המתכנתים.<\/p>\r\n                    <p><strong>אבטחה<\/strong> - הרשאות וסיסמאות - תמיד נעדיף לקבוע סיסמא שמאוחסנת בגליון (\"בתא A2\") ולא לתת אותה בקוד, שלא תיחשף. (שימו לב: אם משתפים את הגליון עצמו, גם כקישור להעתקה, הסיסמה שבתא חשופה לכל מי שמקבל אותו.)<\/p>\r\n                    <p><strong>איטרציות<\/strong> - חזרות, פינג פונג של שיפורים כדי להגיע למוצר שלם עם התכונות שרצינו, פועלות טוב ונראות טוב.<\/p>\r\n                    <p><strong>API<\/strong> - גישה ישירה אל יכולות של כלי בינה, בד\"כ בתשלום לפי שימוש. כדי לשלב באפליקציה יכולת יצירה של תמונות למשל, נוכל לשלם לגוגל על גישה למודל ננו בננה, וכך המשתמשים שלנו יוכלו ליצור תמונות כחלק מהמסע שלהם בתוך האפליקציה שלנו (על חשבוננו).<\/p>\r\n                    <p><strong>קונסול<\/strong> - איזור בדפדפן שמציג שגיאות - כדי להציג לוחצים על F12 במקלדת, ומחפשים ברצועה העליונה סימן של X אדום, או סימן קריאה כתום. לוחצים ומקבלים פירוט שגיאות, שכדאי להעתיק לבינה.<\/p>", "raw": "<p>כולנו משתמשים כמורים באפליקציות שאחרים יצרו. למעקב אחרי משימות, לעבודה משותפת, לתיאום ולעידוד התלמידים.<\/p>\r\n                    <p>אבל לפעמים חסר משהו באפליקציות המוכנות! אנחנו מגלים צורך ספציפי שאין לו מענה קיים, מענה לא מותאם לצרכינו, או - עלות גבוהה.<\/p>\r\n                    <p>היכולת לקבל יישומונים קטנים מכלי בינה, מאפשרת לנו להגדיר *ולאפיין* את המוצר הרצוי, ולבנות אותו בשיחה עם הבינה, ולקיים סבבי שיפור קטנים עד שהמוצר מכיל את כל התכונות שנרצה.<\/p>\r\n                    <p>יש כמה כלים שמאפשרים לקבל קוד מהבינה. ביחידה על אינטראקטיביות בלמידה כבר נגענו בקוד דרך קנבס וארטיפקטים במודלי השפה הגדולים. אבל כדי לבנות אפליקציה שכוללת גם מסד נתונים נוח, שמכילה פיצ'רים מגוונים ויש לה יכולת להציג מידע בצורה חכמה, לבצע מניפולציה על מסד הנתונים - נצטרך לעבוד עם כלים נוספים.<\/p>\r\n                    <p>לאבבל או בייס44 הם כלים שמאפשרים לבנות אפליקציות נחמדות עם בינה, אני לא ממליצה בגלל שהם \"גן סגור\" ובסוף מגבילים את יכולת היצירה בחינם.<\/p>\r\n                    <p>לעומתם, השפה שמצאתי שנותנת מענה להמון צרכים וגם מרחב פעילות וגמישות - היא אפפסקריפט. זו שפה מבית גוגל, שניתן לפתוח מת                 <p>[video: https://www.youtube.com/embed/fhjHSSU0_Xs | הטכניקה - שלבי העבודה (סרטון)]<\/p>\r\n\r\n                    <img src=\"https://i.imgur.com/QBu6U6q.png\" alt=\"תרשים שלבי העבודה\" class=\"illustration\">\r\n\r\n                    <hr>\r\n                    <h4>עריכת הגליון בSHEETS<\/h4>\r\n                    <p>נבנה את הנתונים בהתאם לתכנון: כותרות, שמות לגליון, נכניס קצת מידע לדוגמא<\/p>\r\n                    <p>נפתח בסרגל את 'תוספים' ונבחר אפפסקריפט.<\/p>\r\n                    <p>בפרויקט שנפתח, נדביק את הקוד של CODE GS בעמוד הראשי (במקום מה שיש שם)<\/p>\r\n                    <p>נלחץ על פלוס, נוסיף קובץ HTML. ניתן שם: index או Index ונדביק בו את הקוד המתאים.<\/p>\r\n                    <p>ניתן שם לפרויקט, נבצע שמירה, ונריץ את אחת הפונקציות. ניתן הרשאה.<\/p>\r\n\r\n                    <hr>\r\n                    <h4>פריסה<\/h4>\r\n                    <p>נלחץ על כפתור הפריסה. נבחר פריסה חדשה<\/p>\r\n                    <p>נגדיר בגלגל - אפליקציית WEB.<\/p>\r\n                    <p>נבחר גישה - לכולם.<\/p>\r\n                    <p>ניתן הרשאה, ואם יש אזהרה - נלחץ על \"מתקדם\" ונמשיך בכל זאת.<\/p>\r\n                    <p>נאשר בכפתור 'לפריסה' - ותוך כמה שניות נקבל קישור.<\/p>\r\n                    <p>[video: https://www.youtube.com/embed/WKmcGBLEeqI | סמן - פריסה של אפליקציה של אפפסקריפט]<\/p>\r\n                    <p>ואפשר גם לפרסם את האפליקציה בתוך אתר גוגל סייטס:<\/p>\r\n                    <p>[video: https://www.youtube.com/embed/_-hZ2TORAlY | פרסום מאפפסקריפט לאתר סייטס]<\/p>\r\n\r\n                    <hr>\r\n                    <h4>בדיקה ותיקונים<\/h4>\r\n                    <p>נבדוק איך יצא! נבחן אם הפעולות אכן מפעילות מה שצריך וכותבות לקובץ המקושר. שימו לב, לפעמים התוצאות נשמרות בגליון חדש ונצטרך לבדוק בלשוניות למטה.<\/p>\r\n                    <p>מה לא עובד? מה צריך לשפר? נחזור לבינה ונבקש בפירוט את כל התיקונים הנדרשים<\/p>\r\n                    <p>כאשר אנחנו מעדכנים תיקונים קטנים - במקום ליצור פריסה חדשה, נעדיף ללחוץ \"ניהול \"0 0 24 24\"><polygon points=\"6 3 20 12 6 21 6 3\"/><\/svg><\/span><\/button><\/div>\r\n                        <p>ביחידה נכיר דרכים יעילות לשלב בינה בתהליכי הערכה:<\/p>\r\n                        <ul>\r\n                            <li>בתרגול - ליצור סיכומים ובנק שאלות, דפי חזרה ובוטים מתרגלים<\/li>\r\n                            <li>הערכה חלופית - מחוונים, רעיונות למשימות והנחיות מפורטות<\/li>\r\n                            <li>מיקרו הערכה - לפרק את המבחן לבחנים קטנים ומשחקיים<\/li>\r\n                            <li>בניית המבחן, בדיקה וניתוח המבחן והפקת תובנות והצעות להמשך<\/li>\r\n                        <\/ul>\r\n                        <img src=\"https://i.imgur.com/Dq43X0q.jpg\" alt=\"אילוסטרציה\" class=\"illustration\">", "raw": "<p><strong>ברוכים הבאים למפגש העוסק בשילוב טכנולוגיות בינה מלאכותית בתהליכי הערכה. במפגש זה נלמד כיצד ניתן להיעזר בכלי AI כדי לייעל ולשפר את תהליכי ההערכה, תוך שמירה על האיכות הפדגוגית והמגע האישי שלנו כמורים.<\/strong><\/p>\r\n                        <p><strong>לפני שנצלול לכלים הספציפיים, חשוב להבין את התמונה הרחבה. נתחיל מבסיס תיאורטי והשראה. הסרטונים עוסקים ביסודות ההערכה הפדגוגית, בהבנת מודלי שפה, ומציגים צפי של שילוב AI בתהליכי הערכה.<\/strong><\/p>\r\n                        <h3>סרטון במבט על - הערכה פדגוגית בעידן הדיגיטלי<\/h3>\r\n                        <p>[video: https://www.youtube.com/embed/FiEcaKlEjHk]<\/p>\r\n                        <p>ביחידה נכיר דרכים יעילות לשלב בינה בתהליכי הערכה:<\/p>\r\n                        <ul>\r\n                            <li>בתרגול - ליצור סיכומים ובנק שאלות, דפי חזרה ובוטים מתרגלים<\/li>\r\n                            <li>הערכה חלופית - מחוונים, רעיונות למשימות והנחיות מפורטות<\/li>\r\n                            <li>מיקרו הערכה - לפרק את המבחן לבחנים קטנים ומשחקיים<\/li>\r\n                            <li>בניית המבחן, בדיקה וניתוח המבחן והפקת תובנות והצעות להמשך<\/li>\r\n                        <\/ul>\r\n                        <img src=\"https://i.imgur.com/Dq43X0q.jpg\" alt=\"אילוסטרציה\" class=\"illustration\">"}]}]}, {"id": "tools", "title": "כלים", "intro": "<h1>כלים<\/h1>\r\n<p><strong>בחלק זה נכיר מגוון כלים מעשיים שיסייעו לנו ביצירת כלי הערכה.<\/strong><br />נתחיל בהכנה ובתרגול לקראת מבחן - מיצירת <strong>דף חזרה<\/strong> ועד ל<strong>בוט מותאם<\/strong>, נקפוץ רגע ל<strong>חלופות<\/strong> <strong>הערכה<\/strong>, ומיקרו הערכה. הבינה יכולה לעזור בתכנון המשימות, בניית <strong>מחוון<\/strong> ובבדיקה של התוצרים.<br /><br />נבנה <strong>מבחן<\/strong> איכותי ונחלק ניקוד, ואחרי שהמבחן עבר - ננתח את התוצאות, נפיק תובנות שישתלבו בחזרה בתוכנית העבודה שלנו בעקבות ההערכה.<\/p>\r\n<p><img class=\"illustration\" src=\"https://i.imgur.com/BJNJC5c.jpg\" alt=\"אילוסטרציה\" /><\/p>", "rawIntro": "<h1>כלים<\/h1>\r\n<p><strong>בחלק זה נכיר מגוון כלים מעשיים שיסייעו לנו ביצירת כלי הערכה.<\/strong><br />נתחיל בהכנה ובתרגול לקראת מבחן - מיצירת <strong>דף חזרה<\/strong> ועד ל<strong>בוט מותאם<\/strong>, נקפוץ רגע ל<strong>חלופות<\/strong> <strong>הערכה<\/strong>, ומיקרו הערכה. הבינה יכולה לעזור בתכנון המשימות, בניית <strong>מחוון<\/strong> ובבדיקה של התוצרים.<br /><br />נבנה <strong>מבחן<\/strong> איכותי ונחלק ניקוד, ואחרי שהמבחן עבר - ננתח את התוצאות, נפיק תובנות שישתלבו בחזרה בתוכנית העבודה שלנו בעקבות ההערכה.<\/p>\r\n<p><img class=\"illustration\" src=\"https://i.imgur.com/BJNJC5c.jpg\" alt=\"אילוסטרציה\" /><\/p>", "groups": [{"id": "tools_practice", "title": "תרגול וחזרה", "rule": "one", "need": 1, "intro": "<p><strong>יצירת סיכומים, בנק שאלות ובוטים מתרגלים כדי להכין את התלמידים למבחן בצורה מגוונת ומותאמת.<\/strong><\/p>", "rawIntro": "<p><strong>יצירת סיכומים, בנק שאלות ובוטים מתרגלים כדי להכין את התלמידים למבחן בצורה מגוונת ומותאמת.<\/strong><\/p>", "items": [{"id": "tools_practice-1", "title": "סיכום", "kind": "read", "mode": "view", "videos": [], "comments": false, "html": "<p>יצירת סיכום, יצירת בנק שאלות, דפי חזרה. נוכל להשתמש בכל אחד ממודלי השפה הגדולים; גרוק נותן תוצר נוח להעתקה ולהדפסה.<\/p>\r\n<p><strong>פרומפטים<\/strong><\/p>\r\n<div class=\"prompt-container\"><button class=\"copy-button\"><\/button>\r\n<pre>צור סיכום רציף ונוח לקריאה של [נושא X, ותתי הנושא…] לכיתה [X].<\/pre>\r\n<\/div>\r\n<div class=\"prompt-container\"><button class=\"copy-button\"><\/button>\r\n<pre>הכן דף חזרה למבחן על [נושא, תתי נושאים] לכיתה [X]. צרף רשימת מושגים מרכזיים, 20 שאלות (10 אמריקאיות, 5 נכון/לא נכון, 5 קצרות) וטיפים לזכירה.<\/pre>\r\n<\/div>", "raw": "<p>יצירת סיכום, יצירת בנק שאלות, דפי חזרה. נוכל להשתמש בכל אחד ממודלי השפה הגדולים; גרוק נותן תוצר נוח להעתקה ולהדפסה.<\/p>\r\n<p><strong>פרומפטים<\/strong><\/p>\r\n<div class=\"prompt-container\"><button class=\"copy-button\"><\/button>\r\n<pre>צור סיכום רציף ונוח לקריאה של [נושא X, ותתי הנושא…] לכיתה [X].<\/pre>\r\n<\/div>\r\n<div class=\"prompt-container\"><button class=\"copy-button\"><\/button>\r\n<pre>הכן דף חזרה למבחן על [נושא, תתי נושאים] לכיתה [X]. צרף רשימת מושגים מרכזיים, 20 שאלות (10 אמריקאיות, 5 נכון/לא נכון, 5 קצרות) וטיפים לזכירה.<\/pre>\r\n<\/div>"}, {"id": "tools_practice-2", "title": "ג'אם בוט תרגול", "kind": "video", "mode": "video", "videos": ["KCN47ZThFsI"], "comments": false, "html": "<p>על בוטים למדנו - ותרגול לקראת המבחן הוא אחד השימושים הכי מוצלחים בו! ניתן לבוט את הנושאים ותתי הנושאים, הנחיות לליווי למידה מעודד, בחירה וסיכומי ביניים.<br />אפשר לתת לבוט גם הנחיה לעודד את התלמידים להגיע אל תרגול של מספר יעד מסוים של שאלות, וכאשר הגיעו ליעד - להציג להם הודעה חגיגית, לעודד אותם לצלם מסך ולשלוח אל  המורה כדי לקבל בונוס (למשל).<\/p>\r\n<div class=\"cu4-video\" data-yt=\"KCN47ZThFsI\"><button type=\"button\" class=\"cu4-video-play\" aria-label=\"הפעלת הסרטון\"><img src=\"https://i.ytimg.com/vi/KCN47ZThFsI/hqdefault.jpg\" alt=\"\" loading=\"lazy\"><span class=\"cu4-video-btn\"><svg viewBox=\"0 0 24 24\"><polygon points=\"6 3 20 12 6 21 6 3\"/><\/svg><\/span><\/button><\/div>\r\n<p>הג'אם מתחבר בקלות לקלאסרום, שווה לנסות בלשונית \"סביבת הלמידה\" לחבר בוט בכפתור היצירה.<\/p>", "raw": "<p>על בוטים למדנו - ותרגול לקראת המבחן הוא אחד השימושים הכי מוצלחים בו! utube.com/embed/QHrz5x1Q9Us]<\/p>"}]}]}, {"id": "discussion", "title": "דיון", "intro": "", "rawIntro": "", "groups": [{"id": "discussion", "title": "דיון", "rule": "all", "need": 1, "intro": "", "rawIntro": "", "items": [{"id": "discussion-1", "title": "דיון", "kind": "discussion", "mode": "comment", "videos": [], "comments": true, "html": "<p><strong>חלופה א:<\/strong> כיצד הופכים אצלכם נתונים לפעולות מעשיות?<\/p>\r\n<p><strong>חלופה ב:<\/strong> מה החלק המאתגר לגבי התנהלות אצלכם - והאם יש משהו שלמדתם ביחידה שיכול לעזור?<\/p>\r\n<p><span style=\"font-weight: 400\"><strong>חלופה ג:<\/strong> מה הדבר הכי ממשי שחסך לכם זמן — כלי, תהליך, גישה?<\/span><\/p>\r\n<p><strong>חלופה ד:<\/strong> <span style=\"font-weight: 400\">מה ניסיתם שלא עבד — ולמה לדעתכם?<\/span><\/p>\r\n<p><img class=\"illustration\" src=\"https://i.imgur.com/QiaQy92.jpg\" alt=\"אילוסטרציה\" /><\/p>", "raw": "<p><strong>חלופה א:<\/strong> כיצד הופכים אצלכם נתונים לפעולות מעשיות?<\/p>\r\n<p><strong>חלופה ב:<\/strong> מה החלק המאתגר לגבי התנהלות אצלכם - והאם יש משהו שלמדתם ביחידה שיכול לעזור?<\/p>\r\n<p><span style=\"font-weight: 400\"><strong>חלופה ג:<\/strong> מה הדבר הכי ממשי שחסך לכם זמן — כלי, תהליך, גישה?<\/span><\/p>\r\n<p><strong>חלופה ד:<\/strong> <span style=\"font-weight: 400\">מה ניסיתם שלא עבד — ולמה לדעתכם?<\/span><\/p>\r\n<p><img class=\"illustration\" src=\"https://i.imgur.com/QiaQy92.jpg\" alt=\"אילוסטרציה\" /><\/p>"}]}]}, {"id": "assignment", "title": "משימה", "intro": "", "rawIntro": "", "groups": [{"id": "assignment", "title": "משימה", "rule": "all", "need": 1, "intro": "", "rawIntro": "", "items": [{"id": "assignment-1", "title": "משימה", "kind": "task", "mode": "check", "videos": [], "comments": false, "html": "<p><strong>אפשרות 1: \"מעבדת תהליך\" - תיעוד תהליך עבודה אמיתי<\/strong><\/p>\r\n<p>קחו תהליך ארגוני אחד שחוזר על עצמו אצלכם:<\/p>\r\n<ul>\r\n<li>ארגון ועדת קבלה<\/li>\r\n<li>הכנת דוח תקופתי<\/li>\r\n<li>תכנון יום פדגוגי<\/li>\r\n<li>ניתוח נתונים שכבתיים<\/li>\r\n<\/ul>\r\n<p h4>\n<p>המתכונים מחולקים לקטגוריות: הוראה, וידאו, עיצוב, פיתוח, אוטומציה, מחקר וצוות. לכל מתכון יש רמה: בסיסי, בינוני או מתקדם. מתכון שמסומן \"טרם נוסה\" נכתב בלי ניסוי בפועל, אז כדאי לבדוק אותו בעיניים פקוחות.<\/p>\n<hr />\n<h4>דוגמה: דף עבודה נקי להדפסה, מתמונה של הישן<\/h4>\n<p>צילמתם דף עבודה ישן וסרוק? הסוכן בונה אותו מחדש כדף A4 מוכן להדפסה. כך נראה המתכון, והסוגריים הם המקום שלכם להשלים:<\/p>\n<div class=\"prompt-container\"><button class=\"copy-button\"><\/button><pre>מצורף צילום של דף עבודה [נושא]. בנה אותו מחדש, אל תחדד את הסריקה, כדף A4 לאורך או לרוחב מוכן להדפסה: שחור־לבן בלבד בלי גוונים אפורים, שוליים נדיבים, איורים מצוירים ביד בסגנון זורם (לא אייקונים גאומטריים) שאפשר לצבוע. \nהסר תוויות מיותרות. ודא שכל דוגמה מלמדת את ההבחנה בצורה חד־משמעית ושאין דוגמה עם שתי תשובות אפשריות. בדוק שסימני פיסוק עבריים (כמו סימן שאלה) בכיוון הנכון. שלח לי לאישור.<\/pre><\/div>\n<hr />\n<h4>עוד כמה לטעימה<\/h4>\n<ul>\n<li>תמלול וסיכום של מפגש או וובינר (בינוני)<\/li>\n<li>סרטון הסבר קצר, בשלבים: תסריט, תמונות, רנדר (בינוני)<\/li>\n<li>קריאת קול קורא והמלצה על מסלול הגשה (בסיסי)<\/li>\n<li>התראה בוואטסאפ כשמשהו משתנה באתר או במסמך (בינוני)<\/li>\n<li>בדיקת שגיאות בספר לימוד (מתקדם)<\/li>\n<\/ul>\n<p><strong>שימו לב:<\/strong> גם במתכונים, לא מעלים לסוכן שמות או פרטים מזהים של תלמידים.<\/p>", "raw": "<p><strong>אחרי שהתחברנו, לא צריך להמציא פרומפטים מאפס. בספרייה \"מתכונים למורה עם אינסטינקט\" מחכים פרומפטים מוכנים להעתקה, רובם מתוך שימושים אמיתיים של מורים בקהילה.<\/strong><\/p>\n<div class=\"button-wrapper\"><a class=\"styled-button\" href=\"https://chepti.com/instinct/\" target=\"_blank\" rel=\"noopener\" data-track-click=\"\">לספריית המתכונים<\/a><\/div>\n<h4>שלושה צעדים<\/h4>\n<ol>\n<li>בוחרים מתכון שמתאים למשימה אמיתית שלכם<\/li>\n<li>ממלאים את השדות המסומנים בסוגריים מרובעים, כמו [נושא]<\/li>\n<li>שולחים לאינסטינקט, בודקים את התוצאה ומתקנים בשיחה<\/li>\n<\/ol>\n<h4>מה יש בספרייה<\/h4>\n<p>המתכונים מחולקים לקטגוריות: הוראה, וידאו, עיצוב, פיתוח, אוטומציה, מחקר וצוות. ל ה הייתם צריכים כדי להרגיש בטוחים?<\/p>\n<p><strong>חלופה ג:<\/strong> ניסיתם מתכון מהספרייה? מה עבד ומה צריך לתקן?<\/p>\n<p>מוזמנים להגיב לעמית אחד.<\/p>"}]}]}, {"id": "task", "title": "משימה", "intro": "", "rawIntro": "", "groups": [{"id": "task", "title": "משימה", "rule": "all", "need": 1, "intro": "", "rawIntro": "", "items": [{"id": "task-1", "title": "משימה", "kind": "task", "mode": "check", "videos": [], "comments": false, "html": "<p><strong>מטרה: להפעיל סוכן על משימה אמיתית מהעבודה שלכם, ולהוסיף לספרייה את מה שלמדתם.<\/strong><\/p>\n<h4>מה עושים<\/h4>\n<ol>\n<li>מתחברים לאינסטינקט בצורה בטוחה, לפי הסרטון והכללים<\/li>\n<li>בוחרים מתכון אחד מהספרייה, עדיף ברמה בסיסית, שמתאים למשימה אמיתית שלכם<\/li>\n<li>מריצים אותו, בודקים את התוצאה ומתקנים בשיחה עם הסוכן עד שהיא מתאימה<\/li>\n<li>רושמים מה עבד, מה פחות, ומה הייתם משנים במתכון<\/li>\n<\/ol>\n<h4>מה מגישים<\/h4>\n<p>פוסט עם שם המתכון, מה שלחתם לסוכן, קישור או תמונה של התוצר (בלי פרטים מזהים של תלמידים), ומה למדתם.<\/p>\n<p><strong>בונוס:<\/strong> שלחו מתכון חדש דרך הטופס בספרייה, והוא יתפרסם אחרי אישור.<\/p>\n<p>אם התוצר מתאים לשיתוף, העלו אותו למאגר חומר פתוח.<\/p>\n<div class=\"button-wrapper\"><a class=\"styled-button\" href=\"https://openstuff.co.il/\" target=\"_blank\" rel=\"noopener\" data-track-click=\"\">חומר פתוח<\/a><\/div>\n<div class=\"task-done-box\" style=\"margin:20px 0;padding:15px;background:#f0f7ff;border-right:4px solid var(--primary-color);border-radius:4px;\"><label style=\"display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:bold;\"><input type=\"checkbox\" data-track-manual style=\"width:20px;height:20px;cursor:pointer;\"><span>העליתי לחומר פתוח<\/span><\/label><\/div>\n<p><a class=\"styled-button\" href=\"https://openstuff.co.il/upload/\" target=\"_blank\" rel=\"noopener\" data-track-click=\"\">איך מעלים לחומר פתוח? מדריך, סרטון ושאלות נפוצות<\/a><\/p>", "raw": "<p><strong>מטרה: להפעיל סוכן על משימה אמיתית מהעבודה שלכם, ולהוסיף לספרייה את מה שלמדתם.<\/strong><\/p>\n<h4> var q = new URLSearchParams(location.search);
var n = q.get('unit') || '5';
var unit = UNITS[n];
document.getElementById('kicker').textContent = 'יחידה ' + n;
document.getElementById('htitle').textContent = unit.sidebarTitle;
document.getElementById('cu4').style.setProperty('--cu4-accent', unit.color);
window.cptV4 = { postId: 1, slug: n, unitNo: +n, unitTitle: unit.sidebarTitle, ajaxUrl: '/mock-ajax', loginUrl: '#login',
  isAdmin: q.get('admin') === '1', live: false, nonce: 'x', unit: unit };

// ---- in-memory stand-in for admin-ajax (mirrors includes/v4-model.php rules) ----
(function () {
  var key = 'cu4-preview-' + n;
  var db = JSON.parse(localStorage.getItem(key) || '{"done":[],"notes":{},"comment":false}');
  function save() { localStorage.setItem(key, JSON.stringify(db)); }
  function state() {
    var U = window.cptV4.unit, groups = {}, chapters = {}, itemsDone = 0, total = 0, acc = 0, cn = 0, all = true;
    U.chapters.forEach(function (ch) {
      var sum = 0, req = 0, call = true;
      ch.groups.forEach(function (g) {
        var d = 0;
        g.items.forEach(function (it) {
          total++;
          if (it.mode === 'comment' && db.comment && db.done.indexOf(it.id) < 0) { db.done.push(it.id); }
          if (db.done.indexOf(it.id) >= 0) { d++; }
        });
        itemsDone += d;
        var complete = g.need > 0 && d >= g.need;
        groups[g.id] = { done: d, need: g.need, total: g.items.length, complete: complete };
        if (g.need > 0) { req++; sum += complete ? 1 : d / g.need; if (!complete) { call = false; } }
      });
      chapters[ch.id] = { pct: req ? Math.round(100 * sum / req) : null, complete: req ? call : false };
      if (req) { cn++; acc += chapters[ch.id].pct; if (!call) { all = false; } }
    });
    return { done: db.done.slice(), groups: groups, chapters: chapters, percent: cn && all ? 100 : (cn ? Math.round(acc / cn) : 0),
             items_done: itemsDone, items_total: total };
  }
  document.getElementById('fake-comment').addEventListener('click', function () { db.comment = true; save(); alert('תגובה נרשמה (דמה). עברו לפריט אחר וחזרו.'); });
  var real = window.fetch;
  window.fetch = function (url, opt) {
    if (String(url).indexOf('/mock-ajax') !== 0) { return real.apply(this, arguments); }
    var p = {};
    if (opt && opt.body) { opt.body.forEach(function (v, k) { p[k] = v; }); }
    else { new URLSearchParams(String(url).split('?')[1] || '').forEach(function (v, k) { p[k] = v; }); }
    var out = { success: true, data: {} };
    if (q.get('guest') === '1') { out = { success: false, data: { logged_in: false } }; }
    else if (p.action === 'cpt_v4_state') { out.data = Object.assign(state(), { notes: db.notes, resume: db.pos || null }); }
    else if (p.action === 'cpt_v4_event') {
      if (p.type === 'uncheck') { db.done = db.done.filter(function (x) { return x !== p.item; }); }
      else if (p.type !== 'comment' && db.done.indexOf(p.item) < 0) { db.done.push(p.item); }
      save(); out.data = state(); console.log('[mock] event', p.type, p.item, p.data);
    }
    else if (p.action === 'cpt_v4_note') { if (p.note.trim()) { db.notes[p.item] = p.note; } else { delete db.notes[p.item]; } save(); }
    else if (p.action === 'cpt_save_last_position') { db.pos = p.section_id; save(); }
    else if (p.action === 'cpt_v4_switch') { out.data = { live: p.on === '1' }; }
    else if (p.action === 'cpt_v4_edit') { out = { success: false, data: { message: 'עריכה נשמרת רק באתר (בתצוגה המקומית אין שרת)' } }; }
    return Promise.resolve({ json: function () { return Promise.resolve(out); } });
  };
})();
